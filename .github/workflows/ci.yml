name: 检查与构建

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 静态检查
        run: npm run lint
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: 生产构建
        run: npm run build
